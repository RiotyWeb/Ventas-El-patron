<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Patrón · Ventas</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg?v=2">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#9E1C1F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@600;800&display=swap">
<style>
:root{--red:#C0282A;--red2:#9E1C1F;--ink:#2B1210;--cream:#FFF4E3;--pink:#F6AAB4;--gold:#F0B13B;--green:#5E8C32;--card:#FFF4E3;--muted:#7A4A44;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--red:#A71F22;--red2:#7F1517;--card:#F3E6D2;color-scheme:dark}}
:root[data-theme="dark"]{--red:#A71F22;--red2:#7F1517;--card:#F3E6D2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit;margin:0}
body{background:var(--red) radial-gradient(circle at 20% 10%,rgba(255,255,255,.08),transparent 40%);font-family:Nunito,system-ui,sans-serif;font-weight:600;color:var(--ink);min-height:100vh;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--red2);z-index:10}
header{background:var(--red2);color:var(--cream);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
header img{height:48px;width:48px;object-fit:contain;border-radius:50%;background:var(--pink)}
.brand{font-family:'Titan One',Impact,sans-serif;font-size:1.5rem;letter-spacing:.5px;flex:1;line-height:1}
.resp{width:42%;border:2px solid var(--cream);background:transparent;color:var(--cream);border-radius:10px;padding:8px;font:inherit;font-weight:800}
.resp::placeholder{color:#f3c9bd}
main{padding:14px;max-width:560px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--card);border-radius:18px;padding:14px;border:3px solid var(--ink)}
h2{font-family:'Titan One',Impact,sans-serif;font-weight:400;font-size:1.3rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--gold);font-size:1.4rem;font-weight:800;color:var(--ink)}
.step b{min-width:24px;text-align:center;font-size:1.2rem}
.item{padding:6px 0;border-bottom:1px dashed #c9a58f}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{flex:1;padding:10px 6px;border-radius:12px;border:2px solid var(--ink);background:transparent;font:inherit;font-weight:800;color:var(--ink);min-width:30%}
.chip.on{background:var(--ink);color:var(--cream)}
.total{font-family:'Titan One',Impact,sans-serif;font-size:2rem;color:var(--red2)}
.btn{width:100%;padding:14px;border-radius:14px;border:3px solid var(--ink);background:var(--green);color:#fff;font:inherit;font-weight:800;font-size:1.05rem}
.btn.alt{background:var(--pink);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);padding:8px;font-size:.9rem;border-width:2px}
input.f{width:100%;padding:12px;border-radius:12px;border:2px solid var(--ink);background:#fff;font:inherit;font-weight:700;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border-radius:12px;padding:10px;border:2px solid var(--ink)}
.stat small{display:block;color:var(--muted)}.stat b{font-size:1.25rem}
.empty{color:var(--cream);text-align:center;padding:24px 10px}
.warn{background:var(--gold);border:3px solid var(--ink);border-radius:14px;padding:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--ink);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:6px;z-index:9}
nav button{flex:1;padding:12px 2px;border:0;border-radius:12px;background:transparent;color:var(--cream);font:inherit;font-weight:800}
nav button.on{background:var(--gold);color:var(--ink)}
.list li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed #c9a58f;list-style:none}
ul{padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pigwrap{height:92px;overflow:hidden;display:flex;pointer-events:none;margin-bottom:-22px}
.pig{width:132px;height:auto;align-self:flex-start;transform-origin:50% 100%}
.pig.pop{animation:pop .45s ease-out}
@keyframes pop{from{margin-top:70px}to{margin-top:0}}
@media(prefers-reduced-motion:reduce){.pig.pop{animation:none}}
.p-ventas{justify-content:center}
.p-gastos{justify-content:flex-end;padding-right:18px}.p-gastos .pig{transform:scaleX(-1) rotate(-9deg)}
.p-resumen{justify-content:flex-start;padding-left:18px}.p-resumen .pig{transform:rotate(11deg)}
.p-ajustes{justify-content:center;height:104px}.p-ajustes .pig{width:210px;transform-origin:50% 0}
.card,.btn,.stat,.warn{position:relative;z-index:1}
</style>
</head>

let lastTab='';
const KEY='elpatron_v1';
let S={prices:{cabeza:0,lengua:0,refresco:30},mesas:[],ventas:[],gastos:[],resp:'',logo:'',n:0};
let tab='ventas',day=hoy();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function hoy(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const $=s=>document.querySelector(s),M=n=>'$'+Number(n||0).toLocaleString('es-MX');
const tot=m=>m.cabeza*S.prices.cabeza+m.lengua*S.prices.lengua+m.refresco*S.prices.refresco;
const PAY=['Efectivo','Tarjeta','Transferencia'];
function head(){
  $('#resp').value=S.resp;
  $('#logo').innerHTML=S.logo?'<img alt="El Patrón" src="'+S.logo+'">':'<img alt="El Patrón" src="'+PIG+'">';
  $('#brandtxt').style.display=S.logo?'none':'block';
}
function nav(){
  const t=[['ventas','Ventas'],['gastos','Gastos'],['resumen','Resumen'],['ajustes','Ajustes']];
  $('#nav').innerHTML=t.map(x=>'<button class="'+(tab===x[0]?'on':'')+'" data-t="'+x[0]+'">'+x[1]+'</button>').join('');
}
function step(m,k,l){return '<div class="row item"><span>'+l+' <small>('+M(S.prices[k])+')</small></span><div class="step"><button data-a="dec" data-m="'+m.id+'" data-k="'+k+'" aria-label="Quitar">−</button><b>'+m[k]+'</b><button data-a="inc" data-m="'+m.id+'" data-k="'+k+'" aria-label="Agregar">+</button></div></div>'}
function vVentas(){
  let h='';
  if(!S.prices.cabeza||!S.prices.lengua)h+='<div class="warn">Define el precio de cada cemita en <b>Ajustes</b> para que la cuenta sea correcta.</div>';
  h+='<button class="btn alt" data-a="new">+ Nueva mesa</button>';
  if(!S.mesas.length)h+='<div class="empty">No hay mesas abiertas. Toca “Nueva mesa” para empezar.</div>';
  S.mesas.forEach(m=>{
    h+='<section class="card"><div class="row"><h2>'+m.name+'</h2><button class="btn ghost" style="width:auto" data-a="del" data-m="'+m.id+'">Cancelar</button></div>'
    +step(m,'cabeza','Cemita de cabeza')+step(m,'lengua','Cemita de lengua')+step(m,'refresco','Refresco')
    +'<div class="chips">'+['aqui|Comer aquí','llevar|Para llevar'].map(x=>{const[v,l]=x.split('|');return '<button class="chip '+(m.mode===v?'on':'')+'" data-a="mode" data-m="'+m.id+'" data-v="'+v+'">'+l+'</button>'}).join('')+'</div>'
    +'<div class="chips">'+PAY.map(p=>'<button class="chip '+(m.pay===p?'on':'')+'" data-a="pay" data-m="'+m.id+'" data-v="'+p+'">'+p+'</button>').join('')+'</div>'
    +'<div class="row"><span>Total a cobrar</span><span class="total">'+M(tot(m))+'</span></div>'
    +'<button class="btn" style="margin-top:10px" data-a="cobrar" data-m="'+m.id+'">Cobrar y cerrar mesa</button></section>';
  });
  return h;
}
function vGastos(){
  const g=S.gastos.filter(x=>x.d===hoy());
  let h='<section class="card"><h2>Registrar gasto</h2><div style="display:grid;gap:8px;margin-top:10px"><input class="f" id="gc" placeholder="¿En qué se gastó? (pan, carne, gas…)"><input class="f" id="gm" type="number" inputmode="decimal" placeholder="Monto"><button class="btn" data-a="addg">Guardar gasto</button></div></section>';
  h+='<section class="card"><div class="row"><h2>Gastos de hoy</h2><b>'+M(g.reduce((a,x)=>a+x.m,0))+'</b></div><ul class="list">'
  +(g.length?g.map(x=>'<li><span>'+esc(x.c)+(x.r?' <small>· '+esc(x.r)+'</small>':'')+'</span><span>'+M(x.m)+' <button class="btn ghost" style="width:auto;padding:2px 8px" data-a="delg" data-i="'+x.id+'" aria-label="Borrar">✕</button></span></li>').join(''):'<li>Aún no hay gastos hoy.</li>')+'</ul></section>';
  return h;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function vResumen(){
  const v=S.ventas.filter(x=>x.d===day),g=S.gastos.filter(x=>x.d===day);
  const T=v.reduce((a,x)=>a+x.t,0),G=g.reduce((a,x)=>a+x.m,0),sum=k=>v.reduce((a,x)=>a+x[k],0);
  const by=p=>v.filter(x=>x.pay===p).reduce((a,x)=>a+x.t,0);
  let h='<section class="card"><label for="dd"><small>Día del reporte</small></label><input class="f" id="dd" type="date" value="'+day+'"><button class="btn" style="margin-top:10px" data-a="pdf">Descargar resumen en PDF</button><small style="display:block;margin-top:7px;color:var(--muted)">Se abrirá la opción de imprimir. Elige “Guardar como PDF”.</small></section>';
  h+='<div class="grid2"><div class="stat"><small>Vendido</small><b>'+M(T)+'</b></div><div class="stat"><small>Gastos</small><b>'+M(G)+'</b></div></div>';
  h+='<section class="card" style="background:var(--gold)"><div class="row"><span>Ganancia del día</span><span class="total" style="color:'+(T-G<0?'#8a0000':'var(--ink)')+'">'+M(T-G)+'</span></div></section>';
  h+='<section class="card"><h2>Por método de pago</h2><ul class="list">'+PAY.map(p=>'<li><span>'+p+'</span><b>'+M(by(p))+'</b></li>').join('')+'</ul></section>';
  h+='<section class="card"><h2>Lo que se vendió</h2><ul class="list"><li><span>Cemitas de cabeza</span><b>'+sum('cabeza')+'</b></li><li><span>Cemitas de lengua</span><b>'+sum('lengua')+'</b></li><li><span>Refrescos</span><b>'+sum('refresco')+'</b></li><li><span>Comer aquí / Para llevar</span><b>'+v.filter(x=>x.mode==='aqui').length+' / '+v.filter(x=>x.mode==='llevar').length+'</b></li><li><span>Cuentas cobradas</span><b>'+v.length+'</b></li></ul></section>';
  return h;
}

function exportarPDF(){
  const ventas=S.ventas.filter(x=>x.d===day);
  const gastos=S.gastos.filter(x=>x.d===day);
  const totalVentas=ventas.reduce((a,x)=>a+Number(x.t||0),0);
  const totalGastos=gastos.reduce((a,x)=>a+Number(x.m||0),0);
  const cantidad=k=>ventas.reduce((a,x)=>a+Number(x[k]||0),0);
  const porPago=p=>ventas.filter(x=>x.pay===p).reduce((a,x)=>a+Number(x.t||0),0);
  const dinero=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
  const fecha=new Date(day+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const filasVentas=ventas.length?ventas.map(x=>`
    <tr>
      <td>${esc(x.name||'Cuenta')}</td>
      <td>${Number(x.cabeza||0)}</td><td>${Number(x.lengua||0)}</td><td>${Number(x.refresco||0)}</td>
      <td>${esc(x.mode==='aqui'?'Comer aquí':'Para llevar')}</td>
      <td>${esc(x.pay||'No especificado')}</td><td class="money">${dinero(x.t)}</td>
    </tr>`).join(''):'<tr><td colspan="7" class="empty">No se registraron ventas este día.</td></tr>';
  const filasGastos=gastos.length?gastos.map(x=>`
    <tr><td>${esc(x.c||'Gasto')}</td><td>${esc(x.r||'')}</td><td class="money">${dinero(x.m)}</td></tr>`
  ).join(''):'<tr><td colspan="3" class="empty">No se registraron gastos este día.</td></tr>';
  const w=window.open('','_blank');
  if(!w){alert('El navegador bloqueó la ventana del reporte. Permite las ventanas emergentes e inténtalo de nuevo.');return;}
  w.document.open();
  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Patrón · Reporte ${esc(day)}</title>
  <style>
    *{box-sizing:border-box}body{font:14px Arial,sans-serif;color:#241311;margin:28px}

    .sub{color:#6b514d;margin:6px 0 20px}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid #d8c6bd;padding:10px;border-radius:8px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{border:1px solid #d8c6bd;border-radius:8px;padding:12px}.stat small{display:block;color:#6b514d}.stat strong{font-size:18px}
    table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 6px;border-bottom:1px solid #e2d8d3;text-align:left}th{background:#f7e9e3}.money{text-align:right;white-space:nowrap}.empty{text-align:center;color:#6b514d;padding:14px}
    .payments{display:flex;gap:18px;flex-wrap:wrap}.note{margin-top:24px;color:#76615c;font-size:11px}
    @media print{body{margin:12mm}.no-print{display:none!important}thead{display:table-header-group}tr{break-inside:avoid}}
    @media(max-width:560px){body{margin:14px}.stats{grid-template-columns:1fr}}
  </style></head><body>
  <div class="no-print" style="text-align:right;margin-bottom:16px"><button onclick="window.print()">Imprimir / Guardar PDF</button></div>
  <h1>EL PATRÓN</h1><p class="sub">Reporte diario de ventas y gastos</p>
  <div class="meta"><span><b>Fecha:</b> ${esc(fecha)}</span><span><b>Responsable:</b> ${esc(S.resp||'No especificado')}</span></div>
  <div class="stats">
    <div class="stat"><small>Total de ventas</small><strong>${dinero(totalVentas)}</strong></div>
    <div class="stat"><small>Total de gastos</small><strong>${dinero(totalGastos)}</strong></div>

  </div>

  <table><thead><tr><th>Cuenta</th><th>Cabeza</th><th>Lengua</th><th>Refresco</th><th>Modalidad</th><th>Pago</th><th class="money">Total</th></tr></thead><tbody>${filasVentas}</tbody></table>
  <h2>Resumen de productos</h2>
  <div class="payments"><span>Cemitas de cabeza: <b>${cantidad('cabeza')}</b></span><span>Cemitas de lengua: <b>${cantidad('lengua')}</b></span><span>Refrescos: <b>${cantidad('refresco')}</b></span></div>
  <h2>Ventas por método de pago</h2>
  <div class="payments">${PAY.map(p=>`<span>${esc(p)}: <b>${dinero(porPago(p))}</b></span>`).join('')}</div>
  <h2>Gastos registrados (${gastos.length})</h2>
  <table><thead><tr><th>Concepto</th><th>Responsable</th><th class="money">Monto</th></tr></thead><tbody>${filasGastos}</tbody></table>
  <p class="note">Reporte generado desde el registro local de El Patrón. Conserva este documento como respaldo del día.</p>
  
</body></html>`);
  w.document.close();
  setTimeout(()=>w.print(),350);
}

function vAjustes(){
  return '<section class="card"><h2>Precios</h2><div style="display:grid;gap:8px;margin-top:10px">'
  +[['cabeza','Cemita de cabeza'],['lengua','Cemita de lengua'],['refresco','Refresco']].map(x=>'<label>'+x[1]+'<input class="f" data-p="'+x[0]+'" type="number" inputmode="decimal" value="'+S.prices[x[0]]+'"></label>').join('')+'</div></section>'
  +'<section class="card"><h2>Logo</h2><p style="margin:8px 0">Elige el PNG del cerdito y se guarda en este dispositivo.</p><input class="f" id="lg" type="file" accept="image/*">'+(S.logo?'<button class="btn ghost" style="margin-top:8px" data-a="nologo">Quitar logo</button>':'')+'</section>'
  +'<section class="card"><h2>Datos</h2><p style="margin:8px 0">Todo se guarda solo en este dispositivo. Si borras los datos del navegador, se pierde.</p><button class="btn ghost" data-a="reset">Borrar todo</button></section>';
}
function render(){
  head();nav();
  const pop=tab!==lastTab;lastTab=tab;
  $('#app').innerHTML='<div class="pigwrap p-'+tab+'"><img class="pig'+(pop?' pop':'')+'" alt="" src="'+PIG+'"></div>'+{ventas:vVentas,gastos:vGastos,resumen:vResumen,ajustes:vAjustes}[tab]();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;render();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,m=S.mesas.find(x=>x.id==b.dataset.m);
  if(a==='pdf'){exportarPDF();return}
  if(a==='new'){S.n++;S.mesas.push({id:Date.now(),name:'Mesa '+S.n,cabeza:0,lengua:0,refresco:0,mode:'aqui',pay:'Efectivo'})}
  else if(a==='inc')m[b.dataset.k]++;
  else if(a==='dec')m[b.dataset.k]=Math.max(0,m[b.dataset.k]-1);
  else if(a==='mode')m.mode=b.dataset.v;
  else if(a==='pay')m.pay=b.dataset.v;
  else if(a==='del'){if(confirm('¿Cancelar '+m.name+'?'))S.mesas=S.mesas.filter(x=>x!==m)}
  else if(a==='cobrar'){
    if(!tot(m)&&!confirm('La cuenta está en $0. ¿Cerrar de todos modos?'))return;
    S.ventas.push({d:hoy(),name:m.name,cabeza:m.cabeza,lengua:m.lengua,refresco:m.refresco,mode:m.mode,pay:m.pay,t:tot(m),r:S.resp});
    S.mesas=S.mesas.filter(x=>x!==m);if(!S.mesas.length)S.n=0}
  else if(a==='addg'){const c=$('#gc').value.trim(),v=parseFloat($('#gm').value);
    if(!c||!(v>0)){alert('Escribe el concepto y un monto mayor a 0.');return}
    S.gastos.push({id:Date.now(),d:hoy(),c:c,m:v,r:S.resp})}
  else if(a==='delg')S.gastos=S.gastos.filter(x=>x.id!=b.dataset.i);
  else if(a==='nologo')S.logo='';
  else if(a==='reset'){if(confirm('Se borrarán ventas, gastos y mesas. ¿Seguro?'))S={prices:S.prices,mesas:[],ventas:[],gastos:[],resp:S.resp,logo:S.logo,n:0}}
  save();render();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='dd'){day=el.value||hoy();render()}
  else if(el.dataset.p){S.prices[el.dataset.p]=Math.max(0,parseFloat(el.value)||0);save()}
  else if(el.id==='lg'&&el.files[0]){
    const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
      const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      S.logo=c.toDataURL('image/png');save();render()};im.src=r.result};r.readAsDataURL(el.files[0])}
});
$('#resp').addEventListener('input',e=>{S.resp=e.target.value;save()});
render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(error => {
      console.error("No se pudo registrar el service worker:", error);
    });
  });
}
</script>
